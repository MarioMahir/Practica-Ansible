
---
- name: Configuracion automatizada de servidores Ubuntu
  hosts: servidores
  become: yes

  tasks:

    - name: Actualizar cache de APT
      apt:
        update_cache: yes

    - name: Crear usuario itla
      user:
        name: itla
        state: present
        create_home: yes

    - name: Crear carpeta app
      file:
        path: /app
        state: directory
        mode: '0755'

    - name: Crear archivo hola.txt
      file:
        path: /app/hola.txt
        state: touch
        mode: '0644'

    - name: Instalar cowsay y htop
      apt:
        name:
          - cowsay
          - htop
        state: present
